<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>КСТ Энерго · Проверка фото</title>
<style>*{box-sizing:border-box}body{margin:0;background:#101b29;color:#e7eff9;font:15px system-ui,sans-serif}header{padding:24px 32px;border-bottom:1px solid #293a4e;display:flex;justify-content:space-between;align-items:center}h1{margin:0;font-size:23px}header span{color:#72d3ae;font-size:13px}.layout{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(320px,1fr);gap:24px;padding:28px 32px}.panel{background:#19283b;border:1px solid #2d4059;border-radius:14px;padding:22px}h2{font-size:19px;margin:0 0 15px}select,button{font:inherit;border-radius:8px;border:1px solid #37506e;padding:12px;background:#22354d;color:#e7eff9}select{width:100%;margin-bottom:12px}button{cursor:pointer}button:disabled{opacity:.5;cursor:wait}.primary{background:#2d8a70;border-color:#2d8a70;width:100%;margin:14px 0;font-weight:650}canvas{display:block;max-width:100%;max-height:67vh;margin:0 auto;background:#0a131f;border-radius:8px}.controls{display:flex;gap:10px;margin-bottom:18px}.controls button{flex:1}.muted{color:#9caec4;font-size:13px;line-height:1.6}.status{color:#73d1ae;margin:18px 0}.item{padding:12px;border-bottom:1px solid #2d4059}.item strong{color:#ffc078}.error{color:#ff9999}#summary{line-height:1.7}#recommendation{line-height:1.6;color:#b2c1d5}input{display:none}@media(max-width:900px){.layout{grid-template-columns:1fr;padding:18px}}</style>
<header><h1>КСТ Энерго · Проверка фотографии</h1><a href="http://127.0.0.1:8001/review" target="_blank" rel="noopener" style="color:#72d3ae">Сравнить модели ↗</a></header>
<div class="layout"><div class="panel"><h2>Фотография оборудования</h2><div class="controls"><button id="upload">Выбрать своё фото</button><button id="case">Показать фото из кейса</button></div><input id="file" type="file" accept="image/jpeg,image/png"><select id="photos" aria-label="Фотографии из кейса"></select><canvas id="canvas" width="800" height="500"></canvas></div><div class="panel"><h2>Результат проверки</h2><p class="muted">Выберите фото и нажмите кнопку. На снимке появятся рамки найденных признаков. Результат нужно подтвердить осмотром.</p><button class="primary" id="analyze">Проверить фотографию</button><div class="status" id="status">Выберите фотографию.</div><div id="summary"></div><div id="detections"></div><p id="recommendation"></p><p class="muted" id="timing"></p></div></div>
<script>
const $=s=>document.querySelector(s),canvas=$('#canvas'),ctx=canvas.getContext('2d');let original=null,busy=false;
const names={corrosion:'Признаки коррозии',leak:'Возможная течь',crack:'Возможная трещина',insulation_damage:'Повреждение изоляции',overheating:'Признаки перегрева',contamination:'Загрязнение',mechanical_damage:'Механическое повреждение',missing_part:'Возможное отсутствие детали',ice:'Обмерзание',wear:'Признаки износа',heat_damage:'Следы нагрева',dark_spot:'Тёмное пятно',surface_fold:'Складка поверхности',porosity:'Пористость',surface_scratch:'Царапина',surface_stain:'Пятно на поверхности'};
function draw(detections=[]){if(!original)return;canvas.width=original.width;canvas.height=original.height;ctx.drawImage(original,0,0);ctx.lineWidth=Math.max(2,original.width/300);ctx.font=`${Math.max(15,original.width/55)}px system-ui`;for(const d of detections){const b=d.box,x=b.x*canvas.width,y=b.y*canvas.height,w=b.width*canvas.width,h=b.height*canvas.height;ctx.strokeStyle='#ffb455';ctx.strokeRect(x,y,w,h);const label=names[d.label]||d.label;ctx.fillStyle='#102033';ctx.fillRect(x,Math.max(0,y-30),ctx.measureText(label).width+15,30);ctx.fillStyle='#ffcf91';ctx.fillText(label,x+6,Math.max(22,y-7));}}
async function load(blob){const img=await createImageBitmap(blob);const scale=Math.min(1,1600/Math.max(img.width,img.height));const clean=document.createElement('canvas');clean.width=Math.round(img.width*scale);clean.height=Math.round(img.height*scale);clean.getContext('2d').drawImage(img,0,0,clean.width,clean.height);original=clean;draw();img.close();$('#status').textContent='Фото готово к проверке.';$('#summary').textContent='';$('#detections').replaceChildren();$('#recommendation').textContent='';$('#timing').textContent='';}
async function casePhoto(){const response=await fetch('/photo/'+encodeURIComponent($('#photos').value));await load(await response.blob());}
$('#upload').onclick=()=>$('#file').click();$('#file').onchange=()=>{if($('#file').files[0])load($('#file').files[0])};$('#case').onclick=casePhoto;$('#photos').onchange=casePhoto;
$('#analyze').onclick=async()=>{if(busy||!original)return;busy=true;$('#analyze').disabled=true;$('#status').textContent='Фотография проверяется…';$('#status').className='status';const started=performance.now();try{const blob=await new Promise(resolve=>original.toBlob(resolve,'image/jpeg',.9));const form=new FormData();form.append('file',blob,'inspection.jpg');for(const name of ['equipmentId','componentId','installationId'])form.append(name,'10000000-0000-0000-0000-000000000001');const response=await fetch('/analyze',{method:'POST',body:form}),data=await response.json();if(!response.ok)throw Error(data.detail||'Не удалось проверить фото');draw(data.detections);$('#status').textContent=data.detections.length?'Найдено признаков: '+data.detections.length:'Признаки дефектов не обнаружены';$('#summary').textContent=data.summary;$('#recommendation').textContent=data.recommendation;$('#timing').textContent='Проверка заняла '+((performance.now()-started)/1000).toFixed(1)+' с';$('#detections').replaceChildren();for(const d of data.detections){const row=document.createElement('div');row.className='item';row.textContent=(names[d.label]||d.label)+' · '+Math.round(d.confidence*100)+'%';$('#detections').append(row)}}catch(error){$('#status').className='status error';$('#status').textContent=error.message}finally{busy=false;$('#analyze').disabled=false}};
fetch('/photos').then(r=>r.json()).then(async photos=>{for(const name of photos){const option=new Option(name,name);$('#photos').append(option)}$('#photos').value=photos.find(n=>n===new URLSearchParams(location.search).get('photo'))||photos.find(n=>n.includes('silnaja-korrozija'))||photos[0];if(photos.length)await casePhoto()});
</script></html>
